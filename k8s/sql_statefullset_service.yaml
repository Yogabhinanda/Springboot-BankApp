apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: bankapp-namespace
  labels:
    app: mysql
spec:
  serviceName: "mysql-svc"  # This creates a headless service for stable network identities
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0  # Use a specific, stable version for production
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: bankapp-config
              key: MYSQL_DATABASE
        volumeMounts:
        - name: bankapp-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: bankapp-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: standard

---

apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: bankapp-namespace
  labels:
    app: mysql
spec:
  clusterIP: None  # This creates a headless service for stable network identities
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: mysql

